name: Build CmdPal MSIX Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify .NET SDK version
        run: dotnet --version

      - name: Restore NuGet packages
        run: dotnet restore CmdPal-Definition.sln -p:Platform=${{ matrix.platform }}

      - name: Build MSIX package
        run: |
          msbuild DefinitionExtension/DefinitionExtension.csproj `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeIdentifier=win-${{ matrix.platform }} `
            /p:AppxPackageDir="${{ github.workspace }}/AppPackages/" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:PublishSingleFile=false `
            /p:PublishTrimmed=false `
            /p:GenerateAppxPackageOnBuild=true
        shell: pwsh

      - name: List build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== AppPackages ==="
          if (Test-Path "${{ github.workspace }}/AppPackages") {
            Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse -File | ForEach-Object {
              Write-Host "$($_.Length) bytes  $($_.FullName)"
            }
          } else {
            Write-Host "AppPackages directory does not exist"
          }

      - name: Find MSIX package
        id: find_msix
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue
          if (-not $msixFiles -or $msixFiles.Count -eq 0) {
            Write-Error "No MSIX files found in AppPackages"
            exit 1
          }
          $msixPath = $msixFiles[0].FullName
          Write-Host "Found MSIX: $msixPath"
          echo "MSIX_PATH=$msixPath" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ steps.find_msix.outputs.MSIX_PATH }}

  bundle:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-x64
          path: msix-x64

      - name: Download ARM64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-arm64
          path: msix-arm64

      - name: Prepare signing certificate
        if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.SIGNING_CERT_BASE64 }}")
          $certPath = "${{ github.workspace }}\signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "SIGNING_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Find signtool
        if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($signtool) {
            Write-Host "Found signtool at: $($signtool.FullName)"
            echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "signtool.exe not found"
            exit 1
          }

      - name: Find makeappx
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($makeappx) {
            Write-Host "Found makeappx at: $($makeappx.FullName)"
            echo "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "makeappx.exe not found"
            exit 1
          }

      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle-input
          New-Item -ItemType Directory -Force -Path bundle-output

          Get-ChildItem -Path msix-x64 -Filter "*.msix" | Copy-Item -Destination bundle-input/
          Get-ChildItem -Path msix-arm64 -Filter "*.msix" | Copy-Item -Destination bundle-input/

          Write-Host "Bundle input contents:"
          Get-ChildItem bundle-input

          & $env:MAKEAPPX bundle /d bundle-input /p bundle-output/DefinitionForCommandPalette.msixbundle /o
          Write-Host "Bundle created successfully"

      - name: Sign MSIX artifacts
        if: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $password = "${{ secrets.SIGNING_CERT_PASSWORD }}"
          $timestamp = "http://timestamp.digicert.com"

          & $env:SIGNTOOL sign /fd SHA256 /a /f "$env:SIGNING_CERT_PATH" /p $password /tr $timestamp /td SHA256 "bundle-output\DefinitionForCommandPalette.msixbundle"

          Get-ChildItem -Path msix-x64 -Filter "*.msix" | ForEach-Object {
            & $env:SIGNTOOL sign /fd SHA256 /a /f "$env:SIGNING_CERT_PATH" /p $password /tr $timestamp /td SHA256 $_.FullName
          }

          Get-ChildItem -Path msix-arm64 -Filter "*.msix" | ForEach-Object {
            & $env:SIGNTOOL sign /fd SHA256 /a /f "$env:SIGNING_CERT_PATH" /p $password /tr $timestamp /td SHA256 $_.FullName
          }

      - name: Upload MSIX Bundle
        uses: actions/upload-artifact@v4
        with:
          name: DefinitionForCommandPalette-msixbundle
          path: bundle-output/DefinitionForCommandPalette.msixbundle

      - name: Upload individual MSIX files
        uses: actions/upload-artifact@v4
        with:
          name: DefinitionForCommandPalette-individual-msix
          path: |
            msix-x64/*.msix
            msix-arm64/*.msix
