name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Publish CmdPal Extension to Microsoft Store"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        type: string
      use_new:
        description: 'Use "new" instead of "update" (for initial submission only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'release'

    steps:
      - name: Get release tag
        id: get_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.release_tag }}"
            echo "Input tag from workflow_dispatch: $INPUT_TAG"
            
            # Validate the tag exists and find the correct format
            # Try the input tag as-is first
            if gh api repos/${{ github.repository }}/releases/tags/$INPUT_TAG >/dev/null 2>&1; then
              TAG="$INPUT_TAG"
              echo "Found release with tag: $TAG"
            # Try with 'v' prefix if not present
            elif [[ ! "$INPUT_TAG" =~ ^v ]] && gh api repos/${{ github.repository }}/releases/tags/v$INPUT_TAG >/dev/null 2>&1; then
              TAG="v$INPUT_TAG"
              echo "Found release with tag: $TAG (added 'v' prefix)"
            # Try without 'v' prefix if present
            elif [[ "$INPUT_TAG" =~ ^v ]] && gh api repos/${{ github.repository }}/releases/tags/${INPUT_TAG#v} >/dev/null 2>&1; then
              TAG="${INPUT_TAG#v}"
              echo "Found release with tag: $TAG (removed 'v' prefix)"
            else
              echo "::error::No release found for tag '$INPUT_TAG' or 'v$INPUT_TAG' or '${INPUT_TAG#v}'"
              echo "::error::Please check the release tag and try again."
              exit 1
            fi
          else
            # workflow_run triggered by a release — fetch the latest release tag
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
            echo "Fetched latest release tag: $TAG"
          fi
          
          # Strip 'v' prefix for version number used by WinGet
          TAG_VERSION="${TAG#v}"
          
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "✓ Resolved tag: $TAG"
          echo "✓ WinGet version: $TAG_VERSION"

      - name: Verify release asset exists
        shell: bash
        run: |
          TAG="${{ steps.get_release.outputs.TAG }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/DefinitionForCommandPalette.msixbundle"
          echo "Verifying asset for release tag: $TAG"
          echo "Checking URL: $URL"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "$URL")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "::error::Release asset not found (HTTP $STATUS): $URL"
            echo "::error::Tag used: $TAG"
            echo "::error::Please verify the release exists and has the asset attached."
            exit 1
          fi
          echo "✓ Asset verified (HTTP $STATUS)"

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Check if package exists in winget-pkgs
        id: check_existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if the package manifest directory exists in winget-pkgs
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/r/ruslanlap/DefinitionForCommandPalette")
          if [ "$STATUS" = "200" ]; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Package already exists in winget-pkgs — will use 'update'"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Package NOT found in winget-pkgs — will use 'new'"
          fi

      - name: Download and analyze MSIX bundle
        id: analyze_msix
        shell: pwsh
        run: |
          $tag = "${{ steps.get_release.outputs.TAG }}"
          $tagVersion = "${{ steps.get_release.outputs.TAG_VERSION }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/${tag}/DefinitionForCommandPalette.msixbundle"

          $installerPath = "installer.msixbundle"
          Invoke-WebRequest -Uri $url -OutFile $installerPath
          $hash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
          Write-Host "Installer SHA256: $hash"
          echo "INSTALLER_SHA256=$hash" >> $env:GITHUB_OUTPUT

          # Extract SignatureSha256 from the signed MSIX bundle
          $extractDir = "msix-extract"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path $installerPath -DestinationPath $extractDir -Force
          $sigFile = Join-Path $extractDir "AppxSignature.p7x"
          if (Test-Path $sigFile) {
            $sigHash = (Get-FileHash -Path $sigFile -Algorithm SHA256).Hash
            Write-Host "Signature SHA256: $sigHash"
            echo "SIGNATURE_SHA256=$sigHash" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::No AppxSignature.p7x found - bundle may not be signed"
            echo "SIGNATURE_SHA256=" >> $env:GITHUB_OUTPUT
          }

          # Read package version from the individual MSIX inside the bundle
          # (Bundle.Identity.Version is auto-generated and doesn't match the app version)
          $packageVersion = $null
          $msixFile = Get-ChildItem -Path $extractDir -Filter "*.msix" | Select-Object -First 1
          if ($msixFile) {
            $msixExtractDir = Join-Path $extractDir "msix-inner"
            New-Item -ItemType Directory -Force -Path $msixExtractDir | Out-Null
            Expand-Archive -Path $msixFile.FullName -DestinationPath $msixExtractDir -Force
            $appxManifest = Join-Path $msixExtractDir "AppxManifest.xml"
            if (Test-Path $appxManifest) {
              [xml]$appxXml = Get-Content $appxManifest
              $packageVersion = $appxXml.Package.Identity.Version
            }
          }

          if (-not $packageVersion) {
            # Fallback: try bundle manifest, then tag version
            $bundleManifest = Join-Path $extractDir "AppxMetadata\AppxBundleManifest.xml"
            if (Test-Path $bundleManifest) {
              [xml]$bundleXml = Get-Content $bundleManifest
              $packageVersion = $bundleXml.Bundle.Identity.Version
            }
          }

          if (-not $packageVersion) {
            Write-Host "::warning::Could not read package version; falling back to tag version $tagVersion"
            $packageVersion = $tagVersion
          }

          Write-Host "Package version: $packageVersion"
          echo "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Submit to WinGet
        shell: pwsh
        run: |
          $version = "${{ steps.analyze_msix.outputs.PACKAGE_VERSION }}"
          $tag = "${{ steps.get_release.outputs.TAG }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/${tag}/DefinitionForCommandPalette.msixbundle"
          $token = "${{ secrets.WINGET_GITHUB_TOKEN }}"

          $exists = "${{ steps.check_existing.outputs.EXISTS }}" -eq "true"
          $forceNew = "${{ github.event.inputs.use_new }}" -eq "true"

          if ($exists -and -not $forceNew) {
            Write-Host "Updating existing winget package manifest..."
            .\wingetcreate.exe update "ruslanlap.DefinitionForCommandPalette" `
              --version $version `
              --urls $url `
              --token $token `
              --submit
          } else {
            Write-Host "Creating NEW winget package manifest..."
            .\wingetcreate.exe new $url `
              --version $version `
              --token $token `
              --submit `
              --prtitle "New package: ruslanlap.DefinitionForCommandPalette version $version"
          }
