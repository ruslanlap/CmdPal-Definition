name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Publish CmdPal Extension to Microsoft Store"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        type: string
      use_new:
        description: 'Use "new" instead of "update" (for initial submission only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'release'

    steps:
      - name: Get release tag
        id: get_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            # workflow_run triggered by a release — fetch the latest release tag
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG, version: $VERSION"

      - name: Verify release asset exists
        shell: bash
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.get_release.outputs.TAG }}/DefinitionForCommandPalette.msixbundle"
          echo "Checking: $URL"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "$URL")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "::error::Release asset not found (HTTP $STATUS): $URL"
            exit 1
          fi
          echo "Asset exists (HTTP $STATUS)"

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Check if package exists in winget-pkgs
        id: check_existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if the package manifest directory exists in winget-pkgs
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/r/ruslanlap/DefinitionForCommandPalette")
          if [ "$STATUS" = "200" ]; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "Package already exists in winget-pkgs — will use 'update'"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
            echo "Package NOT found in winget-pkgs — will use 'new'"
          fi

      - name: Submit to WinGet
        shell: pwsh
        run: |
          $version = "${{ steps.get_release.outputs.VERSION }}"
          $tag = "${{ steps.get_release.outputs.TAG }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/${tag}/DefinitionForCommandPalette.msixbundle"
          $token = "${{ secrets.WINGET_GITHUB_TOKEN }}"

          $exists = "${{ steps.check_existing.outputs.EXISTS }}" -eq "true"
          $forceNew = "${{ github.event.inputs.use_new }}" -eq "true"

          if ($exists -and -not $forceNew) {
            Write-Host "Updating existing winget package manifest..."
            .\wingetcreate.exe update "ruslanlap.DefinitionForCommandPalette" `
              --version $version `
              --urls $url `
              --token $token `
              --submit
          } else {
            Write-Host "Creating NEW winget package manifest..."

            # Download installer to compute SHA256
            $installerPath = "installer.msixbundle"
            Invoke-WebRequest -Uri $url -OutFile $installerPath
            $hash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash
            Write-Host "Installer SHA256: $hash"

            # Create manifest directory structure
            $pkgId = "ruslanlap.DefinitionForCommandPalette"
            $manifestDir = "manifests/r/ruslanlap/DefinitionForCommandPalette/$version"
            New-Item -ItemType Directory -Force -Path $manifestDir

            # Version manifest
            @"
            PackageIdentifier: $pkgId
            PackageVersion: $version
            DefaultLocale: en-US
            ManifestType: version
            ManifestVersion: 1.6.0
            "@ -replace '(?m)^\s{12}', '' | Set-Content "$manifestDir/$pkgId.yaml"

            # Installer manifest
            @"
            PackageIdentifier: $pkgId
            PackageVersion: $version
            InstallerType: msix
            Installers:
              - Architecture: x64
                InstallerUrl: $url
                InstallerSha256: $hash
                InstallerType: msix
              - Architecture: arm64
                InstallerUrl: $url
                InstallerSha256: $hash
                InstallerType: msix
            ManifestType: installer
            ManifestVersion: 1.6.0
            "@ -replace '(?m)^\s{12}', '' | Set-Content "$manifestDir/$pkgId.installer.yaml"

            # Default locale manifest
            @"
            PackageIdentifier: $pkgId
            PackageVersion: $version
            PackageLocale: en-US
            Publisher: ruslanlap
            PublisherUrl: https://github.com/ruslanlap
            PackageName: Definition for Command Palette
            PackageUrl: https://github.com/ruslanlap/CmdPal-Definition
            License: MIT
            LicenseUrl: https://github.com/ruslanlap/CmdPal-Definition/blob/main/LICENSE
            ShortDescription: Dictionary lookup extension for Microsoft PowerToys Command Palette
            Tags:
              - command-palette
              - dictionary
              - definition
              - powertoys
              - extension
            ManifestType: defaultLocale
            ManifestVersion: 1.6.0
            "@ -replace '(?m)^\s{12}', '' | Set-Content "$manifestDir/$pkgId.locale.en-US.yaml"

            Write-Host "Generated manifests:"
            Get-ChildItem -Path $manifestDir -Recurse | ForEach-Object { Write-Host $_.FullName }

            # Submit manifests to winget-pkgs
            .\wingetcreate.exe submit `
              --token $token `
              --prtitle "New package: ruslanlap.DefinitionForCommandPalette version $version" `
              $manifestDir
          }
