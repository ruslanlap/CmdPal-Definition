name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Publish CmdPal Extension to Microsoft Store"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to package manifests for (e.g. v1.0.4)'
        required: true
        type: string

permissions:
  contents: read

# This workflow intentionally does NOT call wingetcreate.
#
# wingetcreate's `new` flow requires Sharprompt interactive input even when
# the installer URL is supplied, so it cannot run from a CI runner without a
# TTY. The `update` flow requires the package to already exist in
# microsoft/winget-pkgs, which it does not for this project.
#
# Instead, this workflow packages the winget manifests that live in this
# repository's `winget/` directory so a human can copy them into a
# microsoft/winget-pkgs fork and open the PR out of band. See winget/SUBMIT.md
# for the manual procedure.
#
# Removing the workflow entirely was the alternative; keeping it as a thin
# packaging step preserves the workflow_run trigger wiring so a future
# automated submission (e.g. via the winget-pkgs GitHub App) can replace the
# packaging step without re-architecting the trigger.

jobs:
  package:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: get_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          fi
          TAG_VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG (version $TAG_VERSION)"

      - name: Download release bundle
        shell: pwsh
        run: |
          $tag = "${{ steps.get_release.outputs.TAG }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/DefinitionForCommandPalette.msixbundle"
          Invoke-WebRequest -Uri $url -OutFile DefinitionForCommandPalette.msixbundle
          if (-not (Test-Path DefinitionForCommandPalette.msixbundle)) {
            throw "Release asset download failed: $url"
          }

      - name: Generate current winget manifests
        shell: pwsh
        run: |
          $tag = "${{ steps.get_release.outputs.TAG }}"
          $tagVersion = "${{ steps.get_release.outputs.TAG_VERSION }}"
          $parts = @($tagVersion.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $packageVersion = ($parts[0..3] -join '.')
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/DefinitionForCommandPalette.msixbundle"
          $installerHash = (Get-FileHash DefinitionForCommandPalette.msixbundle -Algorithm SHA256).Hash

          $extractDir = Join-Path $env:RUNNER_TEMP "bundle-signature"
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          [System.IO.Compression.ZipFile]::ExtractToDirectory(
            (Resolve-Path DefinitionForCommandPalette.msixbundle),
            $extractDir
          )
          $sigFile = Join-Path $extractDir "AppxSignature.p7x"
          if (-not (Test-Path $sigFile)) {
            throw "AppxSignature.p7x not found. Refusing to package an unsigned MSIX bundle for WinGet."
          }
          $signatureHash = (Get-FileHash $sigFile -Algorithm SHA256).Hash

          $stage = "winget-current"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $files = @(
            "ruslanlap.DefinitionForCommandPalette.yaml",
            "ruslanlap.DefinitionForCommandPalette.installer.yaml",
            "ruslanlap.DefinitionForCommandPalette.locale.en-US.yaml",
            "ruslanlap.DefinitionForCommandPalette.locale.fr-FR.yaml"
          )

          foreach ($name in $files) {
            $src = Join-Path "winget" $name
            if (-not (Test-Path $src)) { throw "Missing template manifest: $src" }
            $text = Get-Content $src -Raw
            $text = $text -replace '(?m)^PackageVersion:\s*.*$', "PackageVersion: $packageVersion"
            $text = $text -replace 'winget-manifest\.([^.]+)\.[0-9.]+\.schema\.json', 'winget-manifest.$1.1.12.0.schema.json'
            $text = $text -replace '(?m)^ManifestVersion:\s*.*$', 'ManifestVersion: 1.12.0'

            if ($name -like '*.installer.yaml') {
              $text = $text -replace '(?m)^\s*InstallerUrl:\s*.*$', "  InstallerUrl: $url"
              $text = $text -replace '(?m)^\s*InstallerSha256:\s*.*$', "  InstallerSha256: $installerHash"
              $text = [regex]::Replace($text, '(?m)^\s*SignatureSha256:\s*.*\r?\n?', '')
              $needle = "  InstallerSha256: $installerHash"
              $replacement = "  InstallerSha256: $installerHash`r`n  SignatureSha256: $signatureHash"
              $text = $text.Replace($needle, $replacement)
              if ($text -notmatch '(?m)^MinimumOSVersion:') {
                $text = $text -replace '(?m)^InstallerType:\s*msix\s*$', "MinimumOSVersion: 10.0.19041.0`r`nInstallerType: msix"
              }
            }

            Set-Content -Path (Join-Path $stage $name) -Value $text -NoNewline
          }

          Write-Host "PackageVersion: $packageVersion"
          Write-Host "InstallerSha256: $installerHash"
          Write-Host "SignatureSha256: $signatureHash"

          $zip = "winget-manifests-$tag.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Write-Host "Packaged exactly 4 current-version manifests into $zip"

      - name: Upload winget manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ steps.get_release.outputs.TAG }}
          path: winget-manifests-${{ steps.get_release.outputs.TAG }}.zip
          if-no-files-found: error