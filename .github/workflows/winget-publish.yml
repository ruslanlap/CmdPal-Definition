name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Publish CmdPal Extension to Microsoft Store"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to package manifests for (e.g. v1.0.4)'
        required: true
        type: string

permissions:
  contents: read

# This workflow intentionally does NOT call wingetcreate.
#
# wingetcreate's `new` flow requires Sharprompt interactive input even when
# the installer URL is supplied, so it cannot run from a CI runner without a
# TTY. The `update` flow requires the package to already exist in
# microsoft/winget-pkgs, which it does not for this project.
#
# Instead, this workflow packages the winget manifests that live in this
# repository's `winget/` directory so a human can copy them into a
# microsoft/winget-pkgs fork and open the PR out of band. See winget/SUBMIT.md
# for the manual procedure.
#
# Removing the workflow entirely was the alternative; keeping it as a thin
# packaging step preserves the workflow_run trigger wiring so a future
# automated submission (e.g. via the winget-pkgs GitHub App) can replace the
# packaging step without re-architecting the trigger.

jobs:
  package:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: get_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          fi
          TAG_VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG (version $TAG_VERSION)"

      - name: Verify release asset exists
        shell: bash
        run: |
          TAG="${{ steps.get_release.outputs.TAG }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/DefinitionForCommandPalette.msixbundle"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L "$URL")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "::error::Release asset not found (HTTP $STATUS): $URL"
            exit 1
          fi
          echo "✓ MSIX bundle asset verified for $TAG"

      - name: Package winget manifests
        shell: pwsh
        run: |
          $tag = "${{ steps.get_release.outputs.TAG }}"
          $tagVersion = "${{ steps.get_release.outputs.TAG_VERSION }}"

          if (-not (Test-Path winget)) {
            Write-Host "::error::No winget/ directory at repo root — cannot package manifests."
            exit 1
          }

          $manifestFiles = Get-ChildItem -Path winget -Recurse -File
          if ($manifestFiles.Count -eq 0) {
            Write-Host "::error::No manifest files under winget/."
            exit 1
          }

          $zip = "winget-manifests-$tag.zip"
          Compress-Archive -Path winget/* -DestinationPath $zip -Force
          Write-Host "Packaged $($manifestFiles.Count) file(s) into $zip"

      - name: Upload winget manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests-${{ steps.get_release.outputs.TAG }}
          path: winget-manifests-${{ steps.get_release.outputs.TAG }}.zip
          if-no-files-found: error