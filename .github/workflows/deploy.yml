name: Publish CmdPal Extension to Microsoft Store

permissions:
  contents: write

on:
  release:
    types: [released]

  push:
    branches: [master]
    paths:
      - 'DefinitionExtension/Strings/**'
      - 'DefinitionExtension/Helpers/**'
      - 'DefinitionExtension/Pages/**'
      - 'DefinitionExtension/Resources/**'

  workflow_dispatch:
    inputs:
      skip_store_publish:
        description: 'Skip Microsoft Store publish (build only)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -oP 'Version="\K[^"]+' DefinitionExtension/Package.appxmanifest | head -n 1)
            if [[ -z "$VERSION" ]]; then
              VERSION="1.0.1.0"
            fi
          fi
          # Ensure 4-part version (x.y.z.w)
          IFS='.' read -ra PARTS <<< "$VERSION"
          while [ ${#PARTS[@]} -lt 4 ]; do
            PARTS+=("0")
          done
          FULL_VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}.${PARTS[3]}"
          echo "VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Update Package.appxmanifest version
        shell: pwsh
        run: |
          $manifestPath = "DefinitionExtension/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = "${{ steps.get_version.outputs.VERSION }}"
          $manifest.Save($manifestPath)
          Write-Host "Updated manifest version to ${{ steps.get_version.outputs.VERSION }}"

      - name: Restore NuGet packages
        run: dotnet restore CmdPal-Definition.sln -p:Platform=${{ matrix.platform }}

      - name: Build MSIX package
        run: |
          msbuild DefinitionExtension/DefinitionExtension.csproj `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeIdentifier=win-${{ matrix.platform }} `
            /p:AppxPackageDir="${{ github.workspace }}/AppPackages/" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:PublishSingleFile=false `
            /p:PublishTrimmed=false `
            /p:GenerateAppxPackageOnBuild=true
        shell: pwsh

      - name: Find MSIX package
        id: find_msix
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse -Filter "*.msix"
          if ($msixFiles.Count -eq 0) {
            Write-Error "No MSIX files found in AppPackages directory"
            Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $msixPath = $msixFiles[0].FullName
          Write-Host "Found MSIX: $msixPath"
          echo "MSIX_PATH=$msixPath" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ steps.find_msix.outputs.MSIX_PATH }}

  bundle:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-x64
          path: msix-x64

      - name: Download ARM64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-arm64
          path: msix-arm64

      - name: Install Windows SDK (makeappx)
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($makeappx) {
            Write-Host "Found makeappx at: $($makeappx.FullName)"
            echo "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "makeappx.exe not found"
            exit 1
          }

      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle-input
          New-Item -ItemType Directory -Force -Path bundle-output

          # Copy all MSIX files into bundle input
          Get-ChildItem -Path msix-x64 -Filter "*.msix" | Copy-Item -Destination bundle-input/
          Get-ChildItem -Path msix-arm64 -Filter "*.msix" | Copy-Item -Destination bundle-input/

          Write-Host "Bundle input contents:"
          Get-ChildItem bundle-input

          & $env:MAKEAPPX bundle /d bundle-input /p bundle-output/DefinitionForCommandPalette.msixbundle /o
          Write-Host "Bundle created successfully"

      - name: Find signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($signtool) {
            Write-Host "Found signtool at: $($signtool.FullName)"
            echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "signtool.exe not found"
            exit 1
          }

      - name: Create signing certificate
        id: create_cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=11D55891-40B3-4190-95B7-CDE591AABEA5" `
            -KeyUsage DigitalSignature `
            -FriendlyName "CmdPal Definition Signing Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $thumbprint = $cert.Thumbprint
          $pfxPassword = ConvertTo-SecureString -String "MsixSignTemp!" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumbprint" -FilePath signing.pfx -Password $pfxPassword | Out-Null
          echo "CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_OUTPUT
          Write-Host "Certificate created with thumbprint: $thumbprint"

      - name: Sign MSIX Bundle
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f signing.pfx /p "MsixSignTemp!" /fd SHA256 /td SHA256 bundle-output/DefinitionForCommandPalette.msixbundle
          Write-Host "Bundle signed successfully"

      - name: Verify signature and extract SignatureSha256
        shell: pwsh
        run: |
          $bundlePath = "bundle-output/DefinitionForCommandPalette.msixbundle"
          $extractDir = "bundle-verify"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path $bundlePath -DestinationPath $extractDir -Force
          $sigFile = Join-Path $extractDir "AppxSignature.p7x"
          if (Test-Path $sigFile) {
            $sigHash = (Get-FileHash -Path $sigFile -Algorithm SHA256).Hash
            Write-Host "SignatureSha256: $sigHash"
            $installerHash = (Get-FileHash -Path $bundlePath -Algorithm SHA256).Hash
            Write-Host "InstallerSha256: $installerHash"
          } else {
            Write-Error "AppxSignature.p7x not found - signing may have failed!"
            exit 1
          }

      - name: Upload MSIX Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle
          path: bundle-output/DefinitionForCommandPalette.msixbundle

  publish:
    needs: bundle
    runs-on: windows-latest
    if: >-
      (github.event_name == 'release' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_store_publish != 'true'))

    steps:
      - name: Download MSIX Bundle
        uses: actions/download-artifact@v4
        with:
          name: msixbundle
          path: bundle

      - name: Configure Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Authenticate with Microsoft Store
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_CLIENT_SECRET }}
        shell: pwsh

      - name: Publish to Microsoft Store
        run: |
          msstore publish "bundle/DefinitionForCommandPalette.msixbundle" --id 9NMJ8S70L69M
        shell: pwsh

  upload-to-release:
    needs: bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download MSIX Bundle
        uses: actions/download-artifact@v4
        with:
          name: msixbundle
          path: bundle

      - name: Generate SHA256 checksum
        run: |
          cd bundle
          sha256sum DefinitionForCommandPalette.msixbundle > DefinitionForCommandPalette.msixbundle.sha256

      - name: Delete existing release assets (to replace with signed versions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine the release tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # For workflow_dispatch, get the latest release tag
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
          fi
          echo "Deleting existing assets for release tag: $TAG"
          # Get asset IDs and delete them
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' | while read -r ASSET_ID ASSET_NAME; do
            echo "Deleting asset: $ASSET_NAME (ID: $ASSET_ID)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID" || true
          done
          # Store tag for use in upload step
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload signed bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            bundle/DefinitionForCommandPalette.msixbundle
            bundle/DefinitionForCommandPalette.msixbundle.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
