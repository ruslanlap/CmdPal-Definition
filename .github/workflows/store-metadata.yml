name: Update Microsoft Store Metadata

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master]
    paths:
      - 'store-metadata/**'

  workflow_dispatch:

jobs:
  update-metadata:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Validate required secrets
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          $required = @(
            "AZURE_AD_TENANT_ID",
            "SELLER_ID",
            "AZURE_AD_CLIENT_ID",
            "AZURE_AD_CLIENT_SECRET",
            "MSSTORE_APP_ID"
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required GitHub Secrets: $($missing -join ', ')"
            exit 1
          }

      - name: Check metadata file exists
        id: check_metadata
        shell: pwsh
        run: |
          if (Test-Path "store-metadata/metadata.json") {
            "HAS_METADATA=true" >> $env:GITHUB_OUTPUT
            Write-Host "Found store-metadata/metadata.json"
          } else {
            "HAS_METADATA=false" >> $env:GITHUB_OUTPUT
            Write-Host "store-metadata/metadata.json not found. Skipping metadata update steps."
          }

      - name: Validate metadata JSON syntax
        if: steps.check_metadata.outputs.HAS_METADATA == 'true'
        shell: pwsh
        run: |
          Get-Content "store-metadata/metadata.json" -Raw | ConvertFrom-Json | Out-Null
          Write-Host "metadata.json is valid JSON"

      - name: Authenticate with Microsoft Store
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_CLIENT_SECRET }}

      - name: "Preflight: verify Store app access"
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          $appsOutput = msstore apps list -v 2>&1
          $appsText = $appsOutput | Out-String
          Write-Host $appsText

          if ($appsText -notmatch [regex]::Escape($env:MSSTORE_APP_ID)) {
            Write-Error "Configured credentials cannot access app '$env:MSSTORE_APP_ID'. Check Partner Center roles, tenant, seller ID, and app ownership."
            exit 1
          }

      - name: Update submission metadata
        if: steps.check_metadata.outputs.HAS_METADATA == 'true'
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          msstore submission updateMetadata $env:MSSTORE_APP_ID store-metadata/metadata.json

      - name: Publish metadata submission
        if: steps.check_metadata.outputs.HAS_METADATA == 'true'
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          msstore submission publish $env:MSSTORE_APP_ID

      - name: Poll submission status
        if: steps.check_metadata.outputs.HAS_METADATA == 'true'
        shell: pwsh
        env:
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          msstore submission poll $env:MSSTORE_APP_ID
